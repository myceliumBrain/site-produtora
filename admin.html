<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>000 filmes — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Syne:wght@400;500;700;800&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style/style-base.css">
  <link rel="stylesheet" href="style/style-admin.css">
</head>
<body>

  <!-- ══ LOGIN ══════════════════════════════════════════════ -->
  <div id="loginScreen">
    <div class="login-box">
      <div class="login-logo">000 filmes</div>
      <h1 class="login-title">Admin<br>Panel</h1>
      <p class="login-sub">// acesso restrito à equipe</p>
      <div class="field">
        <label>GitHub Token</label>
        <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
      </div>
      <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">Entrar →</button>
      <p id="loginErr"></p>
    </div>
  </div>

  <!-- ══ APP ════════════════════════════════════════════════ -->
  <div id="app">

    <div class="adm-topbar">
      <span class="adm-topbar-logo">000 filmes / admin</span>
      <div class="adm-topbar-right">
        <span id="saveStatus" class="save-status">carregando…</span>
        <button class="btn btn-primary" id="saveBtn" onclick="saveAll()" disabled>
          <span id="saveBtnText">Salvar no GitHub</span>
        </button>
        <button class="btn btn-secondary btn-small" onclick="doLogout()">Sair</button>
      </div>
    </div>

    <div class="adm-layout">

      <!-- SIDEBAR -->
      <aside class="adm-sidebar">
        <span class="sidebar-section">Catálogo</span>
        <button class="nav-btn active" onclick="showPanel('films')">Filmes <span id="filmsCount"></span></button>
        <button class="nav-btn" onclick="showPanel('upcoming')">Em produção <span id="upcomingCount"></span></button>
        <span class="sidebar-section">Institucional</span>
        <button class="nav-btn" onclick="showPanel('manifesto')">Manifesto</button>
        <button class="nav-btn" onclick="showPanel('marcos')">Marcos</button>
        <button class="nav-btn" onclick="showPanel('team')">Equipe</button>
        <button class="nav-btn" onclick="showPanel('parceiros')">Parceiros</button>
      </aside>

      <!-- CONTENT -->
      <main class="adm-content">

        <div class="section-panel active" id="panel-films">
          <div class="panel-header">
            <span class="panel-title">Filmes</span>
            <span class="panel-count" id="filmsPanelCount"></span>
          </div>
          <div id="filmsList"></div>
          <button class="add-btn" onclick="addFilm()">+ adicionar filme</button>
        </div>

        <div class="section-panel" id="panel-upcoming">
          <div class="panel-header">
            <span class="panel-title">Em produção</span>
            <span class="panel-count" id="upcomingPanelCount"></span>
          </div>
          <div id="upcomingList"></div>
          <button class="add-btn" onclick="addUpcoming()">+ adicionar produção</button>
        </div>

        <div class="section-panel" id="panel-manifesto">
          <div class="panel-header"><span class="panel-title">Manifesto</span></div>
          <div id="manifestoForm"></div>
        </div>

        <div class="section-panel" id="panel-marcos">
          <div class="panel-header"><span class="panel-title">Marcos históricos</span></div>
          <div id="marcosList"></div>
          <button class="add-btn" onclick="addMarco()">+ adicionar marco</button>
        </div>

        <div class="section-panel" id="panel-team">
          <div class="panel-header"><span class="panel-title">Equipe</span></div>
          <div id="teamList"></div>
          <button class="add-btn" onclick="addTeamMember()">+ adicionar membro</button>
        </div>

        <div class="section-panel" id="panel-parceiros">
          <div class="panel-header"><span class="panel-title">Parceiros</span></div>
          <div id="parceirosForm"></div>
        </div>

      </main>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast"></div>

  <script src="scripts/script-shared.js"></script>
  <script src="scripts/script-admin.js"></script>
</body>
</html>
